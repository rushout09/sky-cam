<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#02030a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky Cam">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Sky Cam</title>
<style>
  :root { --gold: #f3c76b; --ink: #02030a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #f6ead0; overflow: hidden;
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #view { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain; touch-action: none; }
  video { display: none; }

  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
    background: radial-gradient(ellipse at 50% 40%, #2a1d0a 0%, #0a0b1a 45%, var(--ink) 80%); z-index: 5; }
  #start h1 { font-weight: 300; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); margin: 0 0 4px; font-size: 22px; }
  #start p { margin: 0 0 18px; opacity: .7; max-width: 320px; }
  #start #iosHint { margin: 6px 0 0; font-size: 12px; opacity: .6; }
  #installBtn { min-width: 0; padding: 8px 18px; font-size: 13px; opacity: .85; }
  [hidden] { display: none !important; }
  .btn { border: 1px solid rgba(243,199,107,.55); background: rgba(243,199,107,.08); color: #f6ead0;
    padding: 12px 22px; border-radius: 999px; font: inherit; cursor: pointer; min-width: 220px; }
  .btn.primary { background: var(--gold); color: #1a1205; border-color: var(--gold); font-weight: 600; }

  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 18px calc(18px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: space-around; z-index: 3;
    background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  .round { width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35);
    background: rgba(0,0,0,.35); color: #fff; font-size: 20px; display: grid; place-items: center; cursor: pointer; }
  #shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: var(--gold);
    box-shadow: 0 0 24px rgba(243,199,107,.7); cursor: pointer; }
  #shutter:active { transform: scale(.94); }

  #panel { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 4; width: 250px;
    background: rgba(5,6,16,.82); border: 1px solid rgba(243,199,107,.25); border-radius: 14px; padding: 12px 14px;
    backdrop-filter: blur(8px); display: none; }
  #panel.open { display: block; }
  #panel label { display: block; font-size: 12px; opacity: .8; margin: 8px 0 2px; }
  #panel input[type=range] { width: 100%; accent-color: var(--gold); }
  #panel .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; font-size: 13px; }
  #panel .btn { min-width: 0; width: 100%; padding: 8px; margin-top: 10px; font-size: 13px; }
  #gear { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 3; }
  #hint { position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 14px; z-index: 3; font-size: 12px;
    opacity: .75; max-width: 60vw; text-shadow: 0 1px 3px #000; }
  #presets { position: fixed; left: 0; right: 0; bottom: calc(128px + env(safe-area-inset-bottom)); z-index: 3;
    display: flex; gap: 10px; overflow-x: auto; padding: 0 14px; scrollbar-width: none; }
  #presets::-webkit-scrollbar { display: none; }
  #presets button { flex: 0 0 auto; width: 66px; padding: 0; border: 0; background: none; color: #f6ead0;
    font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; opacity: .75; }
  .cap { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; text-shadow: 0 1px 3px #000; }
  #photoBtn::before { content: '🖼'; } #photoCap::before { content: 'Edit photo'; }
  #photoBtn.camera::before { content: '📷'; } #photoBtn.camera + #photoCap::before { content: 'Camera'; }
  #presets .add { flex: 0 0 auto; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; cursor: pointer; }
  #presets .plus { width: 54px; height: 54px; border-radius: 50%; border: 2px dashed var(--gold); display: grid;
    place-items: center; font-size: 28px; color: var(--gold); background: rgba(0,0,0,.45); }
  #presets .add span:last-of-type { text-shadow: 0 1px 3px #000; }
  #presets button img, #presets .drawn { width: 54px; height: 54px; border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(255,255,255,.35); display: grid; place-items: center; background: #0a0b1a; font-size: 22px; color: var(--gold); }
  #presets button.on { opacity: 1; }
  #presets button.on img, #presets button.on .drawn { border-color: var(--gold); box-shadow: 0 0 12px rgba(243,199,107,.8); }
  #presets button span { text-shadow: 0 1px 3px #000; white-space: nowrap; }
  #toast { position: fixed; left: 50%; bottom: calc(230px + env(safe-area-inset-bottom)); max-width: 80vw; text-align: center; transform: translateX(-50%); z-index: 6; display: none;
    background: rgba(0,0,0,.75); padding: 8px 16px; border-radius: 999px; font-size: 13px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<video id="video" playsinline muted></video>

<div id="start">
  <h1>Sky Cam</h1>
  <p>Point your camera at the open sky, then pick a new sky from the row at the bottom. Buildings and trees stay in front.</p>
  <button class="btn primary" id="startCam">Open camera</button>
  <button class="btn" id="startPhoto">Edit a photo from gallery</button>
  <button class="btn" id="installBtn" hidden>Install app</button>
  <p id="iosHint" hidden>To install: tap Share, then Add to Home Screen</p>
</div>

<div id="hint">Drag to move · pinch to resize</div>
<button class="round" id="gear" title="Settings">⚙</button>
<div id="panel">
  <label>Sky strength</label><input id="intensity" type="range" min="0" max="1" step="0.01" value="0.95">
  <label>Black hole / figure size</label><input id="size" type="range" min="0.4" max="2.4" step="0.01" value="0.9">
  <label>Glow</label><input id="glow" type="range" min="0" max="1" step="0.01" value="0.7">
  <div class="row"><span>Black hole</span><input id="halo" type="checkbox" checked></div>
  <div class="row"><span>Golden embers</span><input id="embers" type="checkbox" checked></div>
  <div class="row"><span>Show detected sky</span><input id="showMask" type="checkbox"></div>
</div>

<div id="presets">
  <label class="add" title="Add your own sky"><span class="plus">+</span><span>Your sky</span>
    <input type="file" id="skyInput" accept="image/*" hidden></label>
</div>
<div id="bar">
  <div class="cap"><button class="round" id="photoBtn" title="Edit a photo from gallery"></button><span id="photoCap"></span></div>
  <button id="shutter" title="Capture"></button>
  <div class="cap"><button class="round" id="flipBtn" title="Switch camera">⟲</button><span>Flip</span></div>
</div>
<div id="toast"></div>

<input type="file" id="photoInput" accept="image/*" hidden>
<script src="app.js"></script>
<script src="pwa.js"></script>
</body>
</html>
